services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: casa_ruiz
      POSTGRES_USER: casa_ruiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casa_ruiz -d casa_ruiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=casa_ruiz;Username=casa_ruiz;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
